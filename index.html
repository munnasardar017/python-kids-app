<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Kids Classroom</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #6b4030 0%, #3e2014 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* গেম বোর্ড ফ্রেম */
    .game-console {
      position: relative;
      background: #ffffff;
      border: 8px solid #3ca0e7;
      border-radius: 28px;
      width: 100%;
      max-width: 820px;
      padding: 42px 14px 14px 14px;
      box-shadow: 0 10px 0 #1b6ca8, 0 15px 25px rgba(0,0,0,0.5);
    }

    /* লাল ব্যানার */
    .ribbon-banner {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #ff5722 0%, #e64a19 100%);
      border: 3px solid #ffccbc;
      border-radius: 14px;
      padding: 6px 28px;
      color: #ffffff;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 5px 0 #bf360c, 0 8px 12px rgba(0,0,0,0.3);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* রোবটের ডায়লগ অংশ */
    .info-bar {
      background: #eef7ff;
      border: 2px solid #81d4fa;
      border-radius: 14px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mascot {
      font-size: 32px;
      line-height: 1;
      display: inline-block;
      transition: transform 0.2s;
    }

    .talking {
      animation: bounceMascot 0.35s infinite alternate ease-in-out;
    }

    @keyframes bounceMascot {
      from { transform: scale(1); }
      to { transform: scale(1.2) rotate(6deg); }
    }

    .mascot-speech {
      font-size: 14px;
      font-weight: bold;
      color: #263238;
      line-height: 1.35;
      flex: 1;
    }

    /* বর্ণমালার অক্ষরের মতো গ্রিড */
    .letters-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(85px, 1fr));
      gap: 8px;
      max-height: 56vh;
      overflow-y: auto;
      padding: 6px 4px;
    }

    /* অক্ষরের স্টাইলে পাইথন বাটন */
    .letter-btn {
      background: #ffffff;
      border: 2px solid #cfd8dc;
      border-radius: 12px;
      padding: 11px 4px;
      font-size: 17px;
      font-weight: 900;
      color: #111111;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #b0bec5;
      user-select: none;
      transition: transform 0.05s, box-shadow 0.05s, background 0.1s;
    }

    .letter-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #b0bec5;
      background: #fff9c4;
      color: #d84315;
    }
  </style>
</head>
<body>

  <div class="game-console">
    <div class="ribbon-banner">SELECT KEYWORD</div>

    <div class="info-bar">
      <div class="mascot" id="mascotIcon">🤖</div>
      <div class="mascot-speech" id="dialogText">বোর্ডের যেকোনো পাইথন কোডে চাপ দিয়ে শেখা শুরু করো!</div>
    </div>

    <div class="letters-grid" id="gridContainer"></div>
  </div>

  <script>
    const items = [
      { code: "print()", en: "Print", bn: "প্রিন্ট দিয়ে স্ক্রিনে লেখা ফুটিয়ে তোলা হয়।" },
      { code: "input()", en: "Input", bn: "ইনপুট দিয়ে ব্যবহারকারীর কাছ থেকে তথ্য জেনে নেওয়া হয়।" },
      { code: "if", en: "If", bn: "ইফ মানে যদি! কোনো শর্ত সত্যি হলে কাজ করবে।" },
      { code: "elif", en: "Elif", bn: "এল-ইফ! আগের শর্ত না মিললে নতুন শর্ত যাচাই করে।" },
      { code: "else", en: "Else", bn: "এলস মানে অন্যথায়! কোনো শর্ত না মিললে যা হবে।" },
      { code: "for", en: "For", bn: "ফর লুপ! একই কাজ গুনে গুনে বারবার করা।" },
      { code: "while", en: "While", bn: "হোয়াইল মানে যতক্ষণ! শর্ত সত্য থাকলে কাজ চলবে।" },
      { code: "def", en: "Def", bn: "ডিএফ দিয়ে নতুন ফাংশন তৈরি করা হয়।" },
      { code: "return", en: "Return", bn: "রিটার্ন দিয়ে কাজের শেষ ফলাফল ফেরত দেওয়া হয়।" },
      { code: "True", en: "True", bn: "ট্রু মানে কথাটি একদম সত্য।" },
      { code: "False", en: "False", bn: "ফলস মানে কথাটি ভুল বা মিথ্যে।" },
      { code: "None", en: "None", bn: "নান মানে এখানে কিছু নেই, একদম শূন্য।" },
      { code: "and", en: "And", bn: "এন্ড মানে এবং! দুটো শর্তই সত্যি হতে হবে।" },
      { code: "or", en: "Or", bn: "অর মানে অথবা! যেকোনো একটা সত্যি হলেই হবে।" },
      { code: "not", en: "Not", bn: "নট দিয়ে সত্যকে মিথ্যে বানিয়ে দেওয়া হয়।" },
      { code: "is", en: "Is", bn: "ইজ দিয়ে যাচাই করা হয় দুটি জিনিস একই কি না।" },
      { code: "in", en: "In", bn: "ইন দিয়ে তালিকার ভেতর জিনিসটি আছে কি না দেখা হয়।" },
      { code: "break", en: "Break", bn: "ব্রেক দিয়ে চলা কাজ মাঝপথে থামিয়ে দেওয়া হয়।" },
      { code: "continue", en: "Continue", bn: "কন্টিনিউ দিয়ে পরের ধাপে এগিয়ে যাওয়া হয়।" },
      { code: "pass", en: "Pass", bn: "পাস দিয়ে কিছু না করে চুপচাপ পার হওয়া যায়।" },
      { code: "import", en: "Import", bn: "ইমপোর্ট দিয়ে বাইরে থেকে টুলস বা লাইব্রেরি আনা হয়।" },
      { code: "class", en: "Class", bn: "ক্লাস দিয়ে অবজেক্ট তৈরির ছাঁচ বানানো হয়।" },
      { code: "try", en: "Try", bn: "ট্রাই দিয়ে কোড সাবধানে চালিয়ে পরখ করা হয়।" },
      { code: "except", en: "Except", bn: "একসেপ্ট দিয়ে কোনো ভুল হলে তা সামলানো হয়।" },
      { code: "len()", en: "Len", bn: "লেন দিয়ে মোট কটি জিনিস আছে তা গুনে নেওয়া হয়।" }
    ];

    const container = document.getElementById("gridContainer");
    const dialog = document.getElementById("dialogText");
    const mascot = document.getElementById("mascotIcon");

    items.forEach(item => {
      const btn = document.createElement("div");
      btn.className = "letter-btn";
      btn.innerText = item.code;
      btn.onclick = () => playKeyword(item);
      container.appendChild(btn);
    });

    function playKeyword(item) {
      dialog.innerHTML = "<strong>মাস্টার:</strong> '" + item.code + "' হলো — " + item.bn;
      window.speechSynthesis.cancel();
      mascot.classList.add("talking");

      const en = new SpeechSynthesisUtterance(item.en);
      en.lang = 'en-US';
      en.rate = 0.85;

      const bn = new SpeechSynthesisUtterance(item.bn);
      bn.lang = 'bn-IN';
      bn.rate = 0.95;

      en.onend = () => window.speechSynthesis.speak(bn);
      bn.onend = () => mascot.classList.remove("talking");

      window.speechSynthesis.speak(en);
    }
  </script>
</body>
</html>
